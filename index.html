<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>NTRUNG IOS ♡ SỬA FILE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:"Quicksand",sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(255,139,207,.18),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(105,220,255,.16),
            transparent 35%
        ),
        #12121e;

    padding:22px 14px 40px;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
}

/* =========================
   MAIN CARD
========================= */

.card{
    position:relative;
    width:100%;

    padding:36px 24px 32px;

    border-radius:34px;

    background:
        linear-gradient(
            145deg,
            rgba(34,29,51,.98),
            rgba(23,22,38,.98)
        );

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 20px 60px rgba(0,0,0,.28),
        0 0 35px rgba(204,120,255,.08);

    overflow:hidden;
}

.card::before{
    content:"";

    position:absolute;

    inset:0;

    border-radius:34px;

    padding:2px;

    background:
        linear-gradient(
            135deg,
            #ff83c8,
            #b889ff,
            #72dcff
        );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    pointer-events:none;
}

/* =========================
   HEADER
========================= */

.logo{
    text-align:center;

    font-size:clamp(29px,8vw,45px);

    font-weight:700;

    letter-spacing:1px;

    line-height:1.15;

    margin-bottom:9px;
}

.logo .ios{
    color:#ff91cf;

    text-shadow:
        0 0 14px rgba(255,145,207,.28);
}

.subtitle{
    text-align:center;

    color:#a9eaff;

    font-size:17px;

    font-weight:500;

    margin-bottom:30px;
}

/* =========================
   STATUS
========================= */

.status{
    width:100%;

    min-height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:11px;

    border-radius:18px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.10);

    color:#9fffd2;

    font-size:17px;

    font-weight:600;

    margin-bottom:32px;
}

.status-dot{
    width:13px;
    height:13px;

    border-radius:50%;

    background:#72ffc2;

    box-shadow:
        0 0 10px #72ffc2,
        0 0 22px rgba(114,255,194,.45);
}

/* =========================
   FORM
========================= */

.form{
    width:100%;
    max-width:560px;

    margin:0 auto;
}

/* =========================
   FIELD
========================= */

.field{
    width:100%;

    margin-bottom:23px;
}

.label{
    display:block;

    width:100%;

    margin-bottom:9px;

    text-align:left;

    font-size:19px;

    font-weight:700;

    color:#f3afd7;
}

/* =========================
   FILE SELECT
========================= */

.file-input{
    position:absolute;

    width:1px;
    height:1px;

    opacity:0;

    overflow:hidden;
}

.file-button{
    width:100%;

    min-height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    padding:12px 18px;

    border-radius:15px;

    border:1.5px dashed rgba(255,145,207,.55);

    background:
        linear-gradient(
            135deg,
            rgba(255,143,207,.08),
            rgba(142,117,255,.08)
        );

    color:#ffc4e5;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:.18s ease;
}

.file-button:active{
    transform:scale(.985);

    background:
        rgba(255,143,207,.14);
}

.file-name{
    width:100%;

    min-height:20px;

    margin-top:7px;

    text-align:center;

    color:#aaa7b9;

    font-size:13px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* =========================
   TEXT INPUT
========================= */

.text-input{
    width:100%;

    height:58px;

    padding:0 17px;

    border:1px solid rgba(255,255,255,.16);

    outline:none;

    border-radius:15px;

    background:#fafafa;

    color:#444153;

    font-family:"Quicksand",sans-serif;

    font-size:17px;

    font-weight:600;

    box-shadow:
        0 5px 15px rgba(0,0,0,.12);

    transition:.18s ease;
}

.text-input::placeholder{
    color:#9692a3;

    font-weight:500;
}

.text-input:focus{
    border-color:#ff92d0;

    box-shadow:
        0 0 0 3px rgba(255,146,208,.10),
        0 5px 18px rgba(0,0,0,.15);
}

/* =========================
   BYTE STATUS
========================= */

.byte-status{
    min-height:23px;

    margin-top:-7px;

    margin-bottom:19px;

    text-align:center;

    color:#aaa6b8;

    font-size:14px;

    font-weight:500;
}

.byte-status.ok{
    color:#8fffc9;
}

.byte-status.error{
    color:#ff9ab8;
}

/* =========================
   HINT
========================= */

.hint{
    text-align:center;

    color:#a5e4f5;

    font-size:15px;

    line-height:1.5;

    margin:4px 0 24px;
}

/* =========================
   BUTTON
========================= */

.patch-btn{
    display:block;

    width:100%;

    max-width:500px;

    min-height:62px;

    margin:0 auto;

    border:none;

    border-radius:31px;

    background:
        linear-gradient(
            100deg,
            #74edc0,
            #87e4ff
        );

    color:#ffffff;

    font-family:"Quicksand",sans-serif;

    font-size:20px;

    font-weight:700;

    letter-spacing:.2px;

    box-shadow:
        0 9px 25px rgba(93,226,198,.16);

    cursor:pointer;

    transition:.18s ease;
}

.patch-btn:active{
    transform:scale(.975);
}

.patch-btn:disabled{
    opacity:.45;

    cursor:not-allowed;

    box-shadow:none;
}

/* =========================
   RESULT
========================= */

.result{
    display:none;

    width:100%;

    max-width:560px;

    margin:20px auto 0;

    padding:16px 18px;

    border-radius:16px;

    text-align:center;

    font-size:15px;

    line-height:1.5;

    border:1px solid rgba(255,255,255,.09);

    background:rgba(255,255,255,.045);
}

.result.show{
    display:block;
}

.result.success{
    color:#9dffd5;
}

.result.error{
    color:#ff9dbb;
}

/* =========================
   DOWNLOAD
========================= */

.download-btn{
    display:none;

    width:100%;

    max-width:500px;

    min-height:55px;

    margin:12px auto 0;

    border:1px solid rgba(201,143,255,.45);

    border-radius:28px;

    background:rgba(188,132,255,.08);

    color:#e4c5ff;

    font-family:"Quicksand",sans-serif;

    font-size:16px;

    font-weight:700;

    cursor:pointer;
}

.download-btn.show{
    display:block;
}

/* =========================
   DIVIDER
========================= */

.divider{
    width:100%;

    height:1px;

    margin:35px auto 27px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}

/* =========================
   CONTACT
========================= */

.contact{
    width:100%;

    text-align:center;
}

.contact-title{
    color:#f0afd5;

    font-size:19px;

    font-weight:700;

    margin-bottom:20px;
}

.contact-line{
    margin:11px 0;

    color:#aaa7b8;

    font-size:15px;

    font-weight:500;
}

.contact-line b{
    color:#d8d3e2;

    font-weight:600;
}

.contact-box{
    width:100%;

    margin:23px auto 0;

    padding:16px 14px;

    border-radius:16px;

    background:rgba(255,143,207,.045);

    border:1px solid rgba(255,143,207,.18);

    color:#e9afd3;

    font-size:15px;

    font-weight:600;
}

.footer{
    text-align:center;

    margin-top:25px;

    color:#686579;

    font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:430px){

    body{
        padding:14px 10px 30px;
    }

    .card{
        padding:30px 19px 27px;

        border-radius:29px;
    }

    .card::before{
        border-radius:29px;
    }

    .logo{
        font-size:31px;
    }

    .subtitle{
        font-size:15px;

        margin-bottom:26px;
    }

    .status{
        min-height:54px;

        font-size:15px;

        margin-bottom:28px;
    }

    .label{
        font-size:18px;
    }

    .text-input{
        height:55px;

        font-size:16px;
    }

    .file-button{
        min-height:55px;

        font-size:16px;
    }

    .patch-btn{
        min-height:59px;

        font-size:19px;
    }

    .contact-line{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

    <!-- HEADER -->
    <div class="logo">
        ♡ NTRUNG <span class="ios">IOS</span> ♡
    </div>

    <div class="subtitle">
        ✦ Hex Sửa File ✦
    </div>

    <!-- STATUS -->
    <div class="status">
        <span class="status-dot"></span>
        <span id="systemStatus">NGUYỄN TRUNG IOS</span>
    </div>

    <!-- FORM -->
    <div class="form">

        <!-- FILE -->
        <div class="field">

            <label class="label">
                ① Chọn file
            </label>

            <input
                type="file"
                id="fileInput"
                class="file-input"
            >

            <label
                for="fileInput"
                class="file-button"
            >
                Chọn file từ Tệp
            </label>

            <div
                class="file-name"
                id="fileName"
            >
                Chưa chọn file
            </div>

        </div>

        <!-- OLD -->
        <div class="field">

            <label class="label" for="oldText">
                ② Tên cũ
            </label>

            <input
                type="text"
                id="oldText"
                class="text-input"
                placeholder="Nhập tên cần sửa..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>

        <!-- NEW -->
        <div class="field">

            <label class="label" for="newText">
                ③ Tên mới
            </label>

            <input
                type="text"
                id="newText"
                class="text-input"
                placeholder="Nhập tên mới..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>

        <!-- BYTE -->
        <div
            class="byte-status"
            id="byteStatus"
        >
            ♡ Nhập tên cũ và tên mới nhé ♡
        </div>

        <!-- HINT -->
        <div class="hint">
            💡 Tên cũ và tên mới phải có cùng số byte UTF-8
        </div>

        <!-- ACTION -->
        <button
            class="patch-btn"
            id="patchBtn"
            disabled
        >
            SỬA NGAY 
        </button>

        <!-- RESULT -->
        <div
            class="result"
            id="result"
        ></div>

        <!-- DOWNLOAD -->
        <button
            class="download-btn"
            id="downloadBtn"
        >
            📥 TẢI FILE ĐÃ SỬA
        </button>

    </div>

    <!-- DIVIDER -->
    <div class="divider"></div>

    <!-- CONTACT -->
    <div class="contact">

        <div class="contact-title">
            ♡ LIÊN HỆ ADMIN ♡
        </div>

        <div class="contact-line">
            🎀 TikTok:
            <b>@nguyentrungios8</b>
        </div>

        <div class="contact-line">
            💬 Telegram:
            <b>@vantrung23128</b>
        </div>

        <div class="contact-line">
            💗 Zalo:
            <b>0983647230</b>
        </div>

        <div class="contact-box">
            🛠️ Nhận make all menu theo yêu cầu ♡
        </div>

    </div>

    <div class="footer">
        Made with ♡ by NTRUNG IOS
    </div>

</div>

</div>


<script>
/* =========================
   ELEMENTS
========================= */

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");

const oldText = document.getElementById("oldText");
const newText = document.getElementById("newText");

const byteStatus = document.getElementById("byteStatus");

const patchBtn = document.getElementById("patchBtn");
const downloadBtn = document.getElementById("downloadBtn");

const result = document.getElementById("result");
const systemStatus = document.getElementById("systemStatus");


/* =========================
   VARIABLES
========================= */

let selectedFile = null;
let patchedBlob = null;
let patchedFileName = "";


/* =========================
   UTF-8 BYTE LENGTH
========================= */

function byteLength(text){

    return new TextEncoder().encode(text).length;

}


/* =========================
   UPDATE FORM STATUS
========================= */

function updateStatus(){

    const oldValue = oldText.value;
    const newValue = newText.value;

    result.className = "result";
    result.innerHTML = "";

    downloadBtn.classList.remove("show");

    patchedBlob = null;


    if(!oldValue && !newValue){

        byteStatus.textContent =
            "♡ Nhập tên cũ và tên mới nhé ♡";

        byteStatus.className = "byte-status";

        patchBtn.disabled = true;

        systemStatus.textContent =
            "SYSTEM READY ♡";

        return;
    }


    if(!oldValue){

        byteStatus.textContent =
            "💗 Hãy nhập tên cũ";

        byteStatus.className =
            "byte-status error";

        patchBtn.disabled = true;

        return;
    }


    if(!newValue){

        byteStatus.textContent =
            "💙 Hãy nhập tên mới";

        byteStatus.className =
            "byte-status error";

        patchBtn.disabled = true;

        return;
    }


    const oldBytes = byteLength(oldValue);
    const newBytes = byteLength(newValue);


    if(oldBytes === newBytes){

        byteStatus.textContent =
            `✓ Độ dài hợp lệ: ${oldBytes} byte`;

        byteStatus.className =
            "byte-status ok";

        patchBtn.disabled =
            !selectedFile;

        systemStatus.textContent =
            selectedFile
            ? "READY TO SỬA ♡"
            : "CHỜ CHỌN FILE ♡";

    }else{

        if(newBytes < oldBytes){

            byteStatus.textContent =
                `⚠ Tên mới thiếu ${oldBytes - newBytes} byte`;

        }else{

            byteStatus.textContent =
                `⚠ Tên mới dư ${newBytes - oldBytes} byte`;

        }

        byteStatus.className =
            "byte-status error";

        patchBtn.disabled = true;

        systemStatus.textContent =
            "BYTE KHÔNG HỢP LỆ ♡";
    }

}


/* =========================
   SELECT FILE
========================= */

fileInput.addEventListener("change", function(){

    selectedFile =
        this.files && this.files.length
        ? this.files[0]
        : null;


    if(selectedFile){

        fileName.textContent =
            "📄 " + selectedFile.name;

        systemStatus.textContent =
            "FILE ĐÃ CHỌN ♡";

    }else{

        fileName.textContent =
            "Chưa chọn file";

        systemStatus.textContent =
            "SYSTEM READY ♡";
    }


    updateStatus();

});


/* =========================
   INPUT EVENTS
========================= */

oldText.addEventListener(
    "input",
    updateStatus
);

newText.addEventListener(
    "input",
    updateStatus
);


/* =========================
   ARRAY BUFFER
========================= */

function replaceBytes(
    buffer,
    oldBytes,
    newBytes
){

    const data =
        new Uint8Array(buffer);

    let count = 0;


    for(
        let i = 0;
        i <= data.length - oldBytes.length;
        i++
    ){

        let found = true;


        for(
            let j = 0;
            j < oldBytes.length;
            j++
        ){

            if(
                data[i + j] !== oldBytes[j]
            ){

                found = false;
                break;
            }

        }


        if(found){

            for(
                let j = 0;
                j < newBytes.length;
                j++
            ){

                data[i + j] =
                    newBytes[j];

            }

            count++;

            i += oldBytes.length - 1;
        }

    }


    return {
        data,
        count
    };

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   SỬA FILE
========================= */

patchBtn.addEventListener(
    "click",
    async function(){

        if(!selectedFile){

            showError(
                "📁 Bạn chưa chọn file!"
            );

            return;
        }


        const oldValue =
            oldText.value;

        const newValue =
            newText.value;


        if(!oldValue || !newValue){

            showError(
                "💗 Vui lòng nhập đủ tên cũ và tên mới!"
            );

            return;
        }


        const oldBytes =
            new TextEncoder().encode(
                oldValue
            );

        const newBytes =
            new TextEncoder().encode(
                newValue
            );


        if(
            oldBytes.length !==
            newBytes.length
        ){

            showError(
                "⚠ Tên cũ và tên mới phải cùng số byte!"
            );

            return;
        }


        try{

            patchBtn.disabled = true;

            patchBtn.textContent =
                "⏳ ĐANG SỬA...";


            systemStatus.textContent =
                "ĐANG XỬ LÝ ♡";


            const buffer =
                await selectedFile.arrayBuffer();


            const resultData =
                replaceBytes(
                    buffer,
                    oldBytes,
                    newBytes
                );


            if(resultData.count === 0){

                showError(
                    `❌ Không tìm thấy tên cũ: "${escapeHTML(oldValue)}"`
                );

                systemStatus.textContent =
                    "KHÔNG TÌM THẤY ♡";

                patchBtn.textContent =
                    "✨ SỬA NGAY ✨";

                updateStatus();

                return;
            }


            patchedBlob =
                new Blob(
                    [resultData.data],
                    {
                        type:
                        selectedFile.type ||
                        "application/octet-stream"
                    }
                );


            patchedFileName =
                "NTrungIOS_" +
                selectedFile.name;


            result.className =
                "result show success";

            result.innerHTML =
                `
                ✨ Sửa thành công!<br>
                Đã thay
                <b>${resultData.count}</b>
                vị trí.
                `;


            downloadBtn.classList.add(
                "show"
            );


            systemStatus.textContent =
                "SỬA THÀNH CÔNG ♡";


            patchBtn.textContent =
                "✨ SỬA LẠI ✨";


            patchBtn.disabled = false;


        }catch(error){

            console.error(error);

            showError(
                "❌ Có lỗi khi đọc hoặc sửa file."
            );

            systemStatus.textContent =
                "CÓ LỖI ♡";

            patchBtn.textContent =
                "✨ SỬA NGAY ✨";

            patchBtn.disabled = false;
        }

    }
);


/* =========================
   DOWNLOAD
========================= */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!patchedBlob){

            return;
        }


        const url =
            URL.createObjectURL(
                patchedBlob
            );


        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            patchedFileName;

        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            () => URL.revokeObjectURL(url),
            1000
        );

    }
);


/* =========================
   ERROR
========================= */

function showError(message){

    result.className =
        "result show error";

    result.innerHTML =
        message;

    downloadBtn.classList.remove(
        "show"
    );

}


/* =========================
   INIT
========================= */

updateStatus();

</script>

</body>
</html>
